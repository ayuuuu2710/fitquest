services:
  - type: web
    name: fitquest-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_TTL_DAYS
        value: "30"
